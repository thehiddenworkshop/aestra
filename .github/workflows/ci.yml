name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format, lint, and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        # Rustup's proxies install the channel/profile/components in rust-toolchain.toml.
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-windows
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check suspended physics adapter formatting
        # Integration builds are explicitly parked; see bevy/PHYSICS_ADAPTERS.md.
        run: |
          cargo fmt --manifest-path bevy/aestra-bevy-avian/Cargo.toml -- --check
          cargo fmt --manifest-path bevy/aestra-bevy-rapier/Cargo.toml -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --features aestra-bench/gpu --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --features aestra-bench/gpu --locked -- -D warnings

  tests:
    name: Workspace tests
    runs-on: windows-latest
    # Temporary cold-build allowance while the compiler cache is populated.
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-windows
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Run workspace tests including GPU benchmark CLI and report helpers
        # Benchmark GPU execution remains opt-in; its ordinary tests are CLI/report helpers.
        run: cargo test --workspace --features aestra-bench/gpu --locked

  portability:
    name: Portable contracts and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-linux
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Build engine-neutral crates without Bevy
        run: >-
          cargo check --locked
          -p aestra-core
          -p aestra-authoring
          -p aestra-project
          -p aestra-runtime
          -p aestra-compiler
          -p aestra-gpu
          -p aestra-artifact

      - name: Verify portable dependencies and shader targets
        run: cargo test --locked -p aestra-gpu --test architecture --test shader_contract
