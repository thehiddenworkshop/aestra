name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format, lint, and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        # Rustup's proxies install the channel/profile/components in rust-toolchain.toml.
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-windows
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --features aestra-bench/gpu --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --features aestra-bench/gpu --locked -- -D warnings

  tests:
    name: Workspace tests
    runs-on: windows-latest
    # Temporary cold-build allowance while the compiler cache is populated.
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-windows
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Run workspace tests including GPU benchmark CLI and report helpers
        # Benchmark GPU execution remains opt-in; its ordinary tests are CLI/report helpers.
        run: cargo test --workspace --features aestra-bench/gpu --locked

  linux-native:
    name: Linux workspace and showcase
    runs-on: ubuntu-latest
    # Full Bevy cold builds need more time than the engine-neutral portability job.
    timeout-minutes: 120
    env:
      # Bound concurrent compiler/linker memory on hosted runners.
      CARGO_BUILD_JOBS: "2"
      # Full Bevy type/variable debug info is costly to compile and link on CI.
      # Keep source-line backtraces; optimization, assertions and overflow checks
      # retain their existing dev/test profile settings. Apply to both graphs.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux application build dependencies
        # Bevy defaults include X11, Wayland, audio and gamepad support.
        # rfd uses its default XDG portal backend, not GTK3.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config time libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install repository Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-linux
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Record Linux build resources
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h

      - name: Check Linux workspace including audio-enabled showcase
        run: cargo check --workspace --all-targets --features aestra-bench/gpu,aestra-bevy/fireworks-audio --locked

      - name: Run strict Linux Clippy
        run: cargo clippy --workspace --all-targets --features aestra-bench/gpu,aestra-bevy/fireworks-audio --locked -- -D warnings

      - name: Run Linux workspace and example tests
        # --all-targets runs the fireworks example's tests, not its windowed main.
        # Ignored native GPU probes remain opt-in; no virtual GPU acceptance is inferred.
        # GNU time preserves Cargo's exit status and records elapsed time/max RSS,
        # including on a signalled child. Exit 143 alone does not identify its cause.
        run: /usr/bin/time -v cargo test --workspace --all-targets --features aestra-bench/gpu,aestra-bevy/fireworks-audio --locked

      - name: Run Linux documentation tests
        # Cargo's --all-targets above excludes doctests. Keep the same feature graph.
        run: /usr/bin/time -v cargo test --workspace --doc --features aestra-bench/gpu,aestra-bevy/fireworks-audio --locked

      - name: Report Linux resources and compiler cache
        if: always()
        # Diagnostics are best-effort only; never mask Cargo/check/lint failures.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
          sccache --show-stats

  portability:
    name: Portable contracts and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install repository Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-linux
          cache-targets: false
          cache-bin: false
          cache-on-failure: true

      - name: Build engine-neutral crates without Bevy
        run: >-
          cargo check --locked
          -p aestra-core
          -p aestra-authoring
          -p aestra-project
          -p aestra-runtime
          -p aestra-compiler
          -p aestra-gpu
          -p aestra-artifact

      - name: Verify portable dependencies and shader targets
        run: cargo test --locked -p aestra-gpu --test architecture --test shader_contract
