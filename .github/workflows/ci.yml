name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-quality-windows
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Workspace tests
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests-windows
          cache-on-failure: true

      - name: Run workspace tests
        run: cargo test --workspace --locked

  portability:
    name: Portable contracts and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-portability-linux
          cache-on-failure: true

      - name: Build engine-neutral crates without Bevy
        run: >-
          cargo check --locked
          -p aestra-core
          -p aestra-authoring
          -p aestra-project
          -p aestra-runtime
          -p aestra-compiler
          -p aestra-gpu
          -p aestra-artifact

      - name: Verify portable dependencies and shader targets
        run: cargo test --locked -p aestra-gpu --test architecture --test shader_contract
