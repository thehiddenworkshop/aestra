[package]
name = "aestra-bevy-avian"
description = "Avian physics for Aestra effects: particles collide with the Avian colliders around them"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The Hidden Workshop"]
repository = "https://github.com/TheHiddenWorkshop/aestra"
publish = false

# Suspended during the Bevy upgrade. Not part of the shipping workspace.
# Keep this integration's dependency resolution independent (PHYSICS_ADAPTERS.md).
[workspace]

[dependencies]
aestra-bevy = { path = "../aestra-bevy" }
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
bevy = "=0.19.1"

[patch.crates-io]
bevy_input_focus = { path = "../../vendor/bevy_input_focus" }
bevy_pbr = { path = "../../vendor/bevy_pbr" }
