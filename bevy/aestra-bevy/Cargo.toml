[package]
name = "aestra-bevy"
description = "Bevy integration and reference playback runtime for Aestra effects"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# WAV decoding belongs to the opt-in showcase host, not the VFX runtime.
fireworks-audio = ["bevy/wav"]

[dependencies]
aestra-bevy-render = { path = "../aestra-bevy-render" }
aestra-compiler = { path = "../../crates/aestra-compiler" }
aestra-core = { path = "../../crates/aestra-core" }
aestra-runtime = { path = "../../crates/aestra-runtime" }
bevy.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
aestra-artifact = { path = "../../crates/aestra-artifact" }
# Used by the `minimal_player` example to resolve an authored effect into a
# compiled project. The crate itself plays an already-compiled project, so this
# stays a dev-dependency: producing the artifact is the host application's job.
aestra-project = { path = "../../crates/aestra-project" }
# The `fluid_world` example's smoke and water (fluid F11).
aestra-fluid = { path = "../../extensions/aestra-fluid" }
wesl.workspace = true
