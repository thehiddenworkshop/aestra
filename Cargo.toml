[workspace]
resolver = "2"
exclude = [
    "vendor/bevy_input_focus",
    "vendor/bevy_pbr",
    "vendor/bevy_input_focus_020",
    "vendor/bevy_pbr_020",
    "benchmarks/bevy-upgrade/patches-020",
    # Temporarily suspended, independently resolved integrations; see bevy/PHYSICS_ADAPTERS.md.
    "bevy/aestra-bevy-avian",
    "bevy/aestra-bevy-rapier",
]
members = [
    "apps/aestra-bench",
    "apps/aestra-editor",
    "apps/aestra-viewer",
    "bevy/aestra-bevy",
    "bevy/aestra-bevy-render",
    "crates/aestra-artifact",
    "crates/aestra-core",
    "crates/aestra-authoring",
    "crates/aestra-compiler",
    "crates/aestra-extension",
    "crates/aestra-gpu",
    "crates/aestra-project",
    "crates/aestra-runtime",
    "extensions/aestra-example-extension",
    "extensions/aestra-fluid",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The Hidden Workshop"]
repository = "https://github.com/TheHiddenWorkshop/aestra"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["bevy_feathers", "shader_format_wesl"] }
resvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
fluent-bundle = "0.16"
encase = "0.12.1"
glam = { version = "0.32.1", features = ["encase"] }
image = { version = "0.25", default-features = false, features = ["png"] }
elkrs = "=0.1.1"
# Keep compiler pins aligned with aestra_gpu::shader::SHADER_COMPILER_ID.
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out", "hlsl-out"] }
pollster = "0.4"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3.27"
unic-langid = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
wesl = "=0.6.0"
wgpu = "29.0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# Bevy 0.19.1 dispatches keyboard events with end-of-frame modifiers; see vendor README.
bevy_input_focus = { path = "vendor/bevy_input_focus" }
# Bevy 0.19.1 recreates GPU cluster buffers every frame; see vendor patch notes.
bevy_pbr = { path = "vendor/bevy_pbr" }
