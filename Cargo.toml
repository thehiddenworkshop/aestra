[workspace]
resolver = "2"
members = [
    "aestra-editor",
    "aestra-bevy",
    "aestra-viewer",
    "crates/aestra-core",
    "crates/aestra-authoring",
    "crates/aestra-compiler",
    "crates/aestra-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["The Hidden Workshop"]
repository = "https://github.com/TheHiddenWorkshop/aestra"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["shader_format_wesl"] }
fluent-bundle = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unic-langid = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
