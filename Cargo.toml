[workspace]
resolver = "2"
members = [
    "aestra-editor",
    "aestra-bevy",
    "aestra-viewer",
    "crates/aestra-bevy-render",
    "crates/aestra-core",
    "crates/aestra-authoring",
    "crates/aestra-compiler",
    "crates/aestra-gpu",
    "crates/aestra-project",
    "crates/aestra-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The Hidden Workshop"]
repository = "https://github.com/TheHiddenWorkshop/aestra"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["bevy_feathers", "shader_format_wesl"] }
bevy_resvg = "2.5"
fluent-bundle = "0.16"
encase = "0.12.1"
glam = { version = "0.32.1", features = ["encase"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3.27"
unic-langid = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
