[workspace]
resolver = "2"
members = [
    "aestra-editor",
    "aestra-bevy",
    "aestra-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["The Hidden Workshop"]
repository = "https://github.com/TheHiddenWorkshop/aestra"

[workspace.dependencies]
bevy = "0.19.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
