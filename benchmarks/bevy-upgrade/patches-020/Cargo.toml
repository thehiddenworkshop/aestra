[package]
name = "aestra-bevy-020-patch-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Real source qualification, independent of the shipping Bevy 0.19 workspace.
[workspace]

[features]
# Separate native gates: existing fixtures intentionally inspect a local RenderApp.
async-qualification = ["bevy/multi_threaded"]
# Required editor API qualification, isolated from native renderer feature graphs.
editor-qualification = ["bevy/bevy_feathers", "bevy/bevy_scene", "bevy/bevy_clipboard", "bevy/default_font", "bevy/bevy_ui_render"]

[dependencies]
bevy_app = "=0.20.0"
bevy_ecs = "=0.20.0"
bevy_input = "=0.20.0"
bevy_input_focus = "=0.20.0"
bevy_window = "=0.20.0"

[dev-dependencies]
tempfile = "3"
bevy = { version = "=0.20.0", default-features = false, features = ["3d_bevy_render", "bevy_sprite_render", "bevy_log", "bevy_ui_widgets", "bevy_picking"] }
bevy_ui_render = { version = "=0.20.0", default-features = false }
aestra-core = { path = "../../../crates/aestra-core" }
aestra-authoring = { path = "../../../crates/aestra-authoring" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
aestra-compiler = { path = "../../../crates/aestra-compiler" }
aestra-gpu = { path = "../../../crates/aestra-gpu" }
aestra-runtime = { path = "../../../crates/aestra-runtime" }
aestra-project = { path = "../../../crates/aestra-project" }
aestra-extension = { path = "../../../crates/aestra-extension" }
aestra-example-extension = { path = "../../../extensions/aestra-example-extension" }
aestra-fluid = { path = "../../../extensions/aestra-fluid" }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
serde_json = "1"
thiserror = "2"
resvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

[patch.crates-io]
bevy_input_focus = { path = "../../../vendor/bevy_input_focus_020" }
bevy_pbr = { path = "../../../vendor/bevy_pbr_020" }

[[test]]
name = "keyboard"
path = "keyboard.rs"

[[test]]
name = "cluster_buffer_reuse"
path = "cluster_buffer_reuse.rs"

[[test]]
name = "shader_composition"
path = "shader_composition.rs"

[[test]]
name = "storage_buffers"
path = "storage_buffers.rs"

[[test]]
name = "extraction"
path = "extraction.rs"

[[test]]
name = "editor_theme"
path = "editor_theme.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_controls"
path = "editor_controls.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_numbers"
path = "editor_numbers.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_colors"
path = "editor_colors.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_text"
path = "editor_text.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_tooltips"
path = "editor_tooltips.rs"
required-features = ["editor-qualification"]

[[test]]
name = "editor_graph"
path = "editor_graph.rs"
required-features = ["editor-qualification"]
