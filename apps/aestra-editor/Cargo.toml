[package]
name = "aestra-editor"
description = "Bevy-native VFX choreography editor for Aestra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aestra-authoring = { path = "../../crates/aestra-authoring" }
aestra-bevy-render = { path = "../../bevy/aestra-bevy-render" }
aestra-compiler = { path = "../../crates/aestra-compiler" }
aestra-core = { path = "../../crates/aestra-core" }
aestra-example-extension = { path = "../../extensions/aestra-example-extension" }
aestra-extension = { path = "../../crates/aestra-extension" }
aestra-gpu = { path = "../../crates/aestra-gpu" }
aestra-project = { path = "../../crates/aestra-project" }
aestra-runtime = { path = "../../crates/aestra-runtime" }
bevy = { workspace = true, features = ["system_clipboard"] }
bevy_resvg.workspace = true
bevy_winit = "0.19.1"
fluent-bundle.workspace = true
base64 = "0.22.1"
gltf = { version = "1.4.1", default-features = false }
image = { workspace = true, features = ["jpeg", "webp", "bmp", "tga"] }
rfd = "0.15"
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
unic-langid.workspace = true
winit = "0.30"

[dev-dependencies]
elkrs.workspace = true
